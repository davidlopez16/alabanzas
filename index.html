<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repertorio de Alabanza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent-orange: #ff6600;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --chord-color: #f59e0b;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); padding: 20px 12px; min-height: 100vh; }
        .container { max-width: 680px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 24px; }
        header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #a5b4fc, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-buttons { display: flex; background: var(--surface); padding: 4px; border-radius: 14px; gap: 4px; margin-bottom: 20px; border: 1px solid var(--border); }
        .nav-buttons button { flex: 1; padding: 10px; font-size: 14px; font-weight: 600; border-radius: 10px; background: transparent; color: var(--text-muted); border: none; cursor: pointer; transition: all 0.2s ease; }
        .nav-buttons button.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .card { background: var(--surface); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .card h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: #f1f5f9; }

        label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        input, select, textarea { width: 100%; background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; font-family: inherit; font-size: 14px; margin-bottom: 16px; transition: border-color 0.2s; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        textarea { height: 260px; font-family: 'Fira Code', monospace; font-size: 13.5px; line-height: 1.6; resize: vertical; }

        button.btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        button.btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        button.btn:active { transform: translateY(0); }
        button.btn-secondary { background: var(--surface-hover); color: var(--text); }
        button.btn-secondary:hover { background: #475569; }
        button.btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        button.btn-danger:hover { background: var(--accent-red); color: white; }
        button.btn-cifraclub { background: var(--accent-orange); color: white; font-weight: 700; }
        button.btn-cifraclub:hover { background: #e65c00; }
        button.sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

        .helper-text { font-size: 12px; color: var(--text-muted); margin-top: -10px; margin-bottom: 14px; }
        .loading { text-align: center; padding: 12px; color: #a5b4fc; font-weight: 600; }

        .setlist-item, .catalog-item { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 14px 16px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); transition: border-color 0.2s, background-color 0.2s, transform 0.15s ease; user-select: none; touch-action: manipulation; }
        .setlist-item:hover, .catalog-item:hover { border-color: var(--primary); }
        
        /* Indicador visual cuando la tarjeta está activa para arrastrar */
        .setlist-item.ready-drag { border-color: var(--primary); transform: scale(1.02); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); cursor: grab; }
        .setlist-item.dragging { opacity: 0.4; background: #1e293b; border-style: dashed; }

        .setlist-info { flex-grow: 1; cursor: pointer; }
        .setlist-title { font-weight: 600; font-size: 15px; color: #f8fafc; }
        .setlist-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-right: 6px; }
        .adoracion { background: rgba(139, 92, 246, 0.2); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3); }
        .alabanza { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .coritos { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .controls { display: flex; gap: 10px; margin: 16px 0; align-items: center; background: #0f172a; padding: 8px 14px; border-radius: 10px; width: fit-content; border: 1px solid var(--border); }
        .key-badge { font-family: 'Fira Code', monospace; font-size: 16px; font-weight: 700; color: var(--primary); padding: 0 8px; }
        
        .song-container {
            font-family: 'Fira Code', monospace;
            font-size: 15px;
            line-height: 1.75;
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #0f172a;
            padding: 18px;
            border-radius: 10px;
            color: #e2e8f0;
            border: 1px solid var(--border);
        }

        .chord {
            color: var(--chord-color);
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎵 Repertorio de Alabanza</h1>
    </header>

    <div class="nav-buttons">
        <button id="tabHoy" class="active" onclick="showSection('hoy')">🔥 Hoy</button>
        <button id="tabRepertorio" onclick="showSection('repertorio')">📖 General</button>
        <button id="tabAgregar" onclick="showSection('agregar')">➕ Nueva</button>
    </div>

    <div id="statusLoading" class="loading">Cargando canciones...</div>

    <div class="card" id="secHoy">
        <div class="header-actions">
            <h2 style="margin:0;">📋 Lista a Tocar Hoy</h2>
            <button class="btn btn-danger sm" onclick="clearSetlist()">Limpiar Lista</button>
        </div>
        <p class="helper-text" style="margin-top:4px; margin-bottom:12px;">Mantén presionada una canción un segundo para reordenarla.</p>
        <div id="setlistContainer" style="margin-top: 15px;">
            <p style="color:var(--text-muted); font-size:14px;">No hay canciones programadas para hoy.</p>
        </div>
    </div>

    <div class="card" id="secAgregar" style="display:none;">
        <h2>Agregar Nueva Canción</h2>

        <label>Nombre de la Canción / Alabanza:</label>
        <div style="display:flex; gap:8px;">
            <input type="text" id="newTitle" placeholder="Ej: Cuan Grande es Él" autocomplete="off">
            <button type="button" class="btn btn-cifraclub" onclick="openCifraClubSearch()" style="white-space:nowrap; height: 44px;">🔍 Buscar en CifraClub</button>
        </div>
        <div class="helper-text">Se abrirá CifraClub en otra pestaña para buscar los acordes rápidamente.</div>

        <label>Categoría:</label>
        <select id="newCategory">
            <option value="Adoración">Adoración</option>
            <option value="Alabanza">Alabanza</option>
            <option value="Coritos">Coritos</option>
        </select>

        <label>Tono Base:</label>
        <select id="newKey">
            <optgroup label="Tonalidades Mayores">
                <option value="C">C (Do)</option>
                <option value="C#">C# / Db</option>
                <option value="D">D (Re)</option>
                <option value="D#">D# / Eb</option>
                <option value="E">E (Mi)</option>
                <option value="F">F (Fa)</option>
                <option value="F#">F# / Gb</option>
                <option value="G">G (Sol)</option>
                <option value="G#">G# / Ab</option>
                <option value="A">A (La)</option>
                <option value="A#">A# / Bb</option>
                <option value="B">B (Si)</option>
            </optgroup>
            <optgroup label="Tonalidades Menores">
                <option value="Cm">Cm (Do menor)</option>
                <option value="C#m">C#m / Dbm</option>
                <option value="Dm">Dm (Re menor)</option>
                <option value="D#m">D#m / Ebm</option>
                <option value="Em">Em (Mi menor)</option>
                <option value="Fm">Fm (Fa menor)</option>
                <option value="F#m">F#m / Gbm</option>
                <option value="Gm">Gm (Sol menor)</option>
                <option value="G#m">G#m / Abm</option>
                <option value="Am">Am (La menor)</option>
                <option value="A#m">A#m / Bbm</option>
                <option value="Bm">Bm (Si menor)</option>
            </optgroup>
        </select>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label style="margin:0;">Letra y Acordes:</label>
            <button type="button" class="btn btn-secondary sm" onclick="autoDetectKeyAndClean()">📋 Detectar Tono</button>
        </div>
        <textarea id="newBody" placeholder="Pega aquí la letra con acordes copiada de CifraClub..."></textarea>
        <!-- Donde tienes la letra/cuerpo de la canción -->
        <label>Letra y Acordes:</label>
        <textarea id="newBody" placeholder="Pega la letra con acordes aquí..."></textarea>

<!-- AGREGAR AQUÍ EL NUEVO CAMPO -->
<label>Resumen de Notas / Estructura (Opcional):</label>
<textarea id="newNotes" placeholder="Ej: Intro: G-D-Em-C (x2) | Verso: G-Em | Coro: C-D-G"></textarea>

        <button class="btn" id="btnSave" onclick="saveSong()" style="width:100%;">Guardar Canción</button>
    </div>

    <div class="card" id="secRepertorio" style="display:none;">
        <h2>📖 Repertorio General</h2>
        <label>Buscar por Título:</label>
        <input type="text" id="searchCatalog" placeholder="Escribe para buscar..." oninput="renderCatalog()">

        <label>Filtrar por categoría:</label>
        <select id="categoryFilter" onchange="renderCatalog()">
            <option value="todas">Todas las categorías</option>
            <option value="Adoración">Adoración</option>
            <option value="Alabanza">Alabanza</option>
            <option value="Coritos">Coritos</option>
        </select>

        <div id="catalogList" style="margin-top: 15px;"></div>
    </div>

    <div class="card" id="songDisplay" style="display:none;">
        <div class="header-actions">
            <h2 id="songTitle" style="margin:0; font-size: 22px;"></h2>
            <button class="btn sm" id="btnAddToHoy" onclick="addCurrentSongToHoy()">+ Añadir a Hoy</button>
        </div>
        <div style="margin-top: 4px;"><span id="songCategory" class="badge"></span></div>
        
        <div class="controls">
            <span style="font-size:13px; font-weight:600; color:var(--text-muted);">Tono:</span>
            <button class="btn btn-secondary sm" onclick="transpose(-1)">-1</button>
            <span id="keyDisplay" class="key-badge">C</span>
            <button class="btn btn-secondary sm" onclick="transpose(1)">+1</button>
        </div>

        <div id="songBody" class="song-container"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZ8PYSQOG8HlVp6QM6jlVGwcBo0uhuCDbzoEnbjp5Hs7F0DUK2k68_Nhsdib3WF3JBNw/exec';

    let songs = [];
    let setlist = [];
    const chromaticScale = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const flatsToSharps = { "Db":"C#", "Eb":"D#", "Gb":"F#", "Ab":"G#", "Bb":"A#" };

    let currentSong = null;
    let semitoneOffset = 0;
    let dragSrcIndex = null;
    let pressTimer = null;

    async function fetchSongs() {
        document.getElementById('statusLoading').style.display = 'block';
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            songs = data.songs || [];
            setlist = data.setlist || [];
            
            renderSetlist();
            renderCatalog();
        } catch (e) {
            console.error(e);
            alert('Error al conectar con la base de datos.');
        } finally {
            document.getElementById('statusLoading').style.display = 'none';
        }
    }

    function toggleNotesDisplay(songId) {
        const notesDiv = document.getElementById(`notes-${songId}`);
        if (notesDiv) {
            notesDiv.style.display = notesDiv.style.display === 'none' ? 'block' : 'none';
        }
    }

    function renderSetlist() {
        const container = document.getElementById('setlistContainer');
        container.innerHTML = '';

        if (setlist.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted); font-size:14px;">No hay canciones programadas para hoy.</p>';
            return;
        }

        setlist.forEach((item, index) => {
            const song = songs.find(s => 
                s.id.toString() === item.songId.toString() || 
                s.title.toLowerCase() === item.songId.toString().toLowerCase()
            );

            if (song) {
                const div = document.createElement('div');
                div.className = 'setlist-item-wrapper';
                div.dataset.index = index;

                div.innerHTML = `
                    <div class="setlist-item">
                        <div class="setlist-info" onclick="handleSongClick(event, '${song.id}')">
                            <div class="setlist-title">${song.title}</div>
                            <div class="setlist-sub">${song.category} • Tono: <strong style="color:var(--primary);">${song.key}</strong></div>
                        </div>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            ${song.notes ? `<button class="btn sm" onclick="toggleNotesDisplay('set-${song.id}')" title="Ver estructura de acordes">🎵 Notas</button>` : ''}
                            <button class="btn btn-danger sm" onclick="removeFromSetlist(${index})" title="Quitar de la lista de hoy">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    ${song.notes ? `<div id="notes-set-${song.id}" class="notes-preview" style="display:none; padding:8px; background:var(--card-bg, #1e1e1e); border-left:3px solid var(--primary); font-family:monospace; margin-top:4px;">${song.notes}</div>` : ''}
                `;

                container.appendChild(div);
            }
        });
    }

    function renderCatalog() {
        const container = document.getElementById('catalogList');
        const catFilter = document.getElementById('categoryFilter').value;
        const searchText = document.getElementById('searchCatalog').value.toLowerCase().trim();
        
        container.innerHTML = '';

        let filtered = songs;
        if (catFilter !== 'todas') {
            filtered = filtered.filter(s => s.category === catFilter);
        }
        if (searchText) {
            filtered = filtered.filter(s => s.title.toLowerCase().includes(searchText));
        }

        if (filtered.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted); font-size:14px;">No se encontraron canciones.</p>';
            return;
        }

        filtered.forEach(song => {
            const inSetlist = setlist.some(item => item.songId.toString() === song.id.toString() || item.songId.toString().toLowerCase() === song.title.toLowerCase());
            
            const div = document.createElement('div');
            div.className = 'catalog-item-wrapper';
            div.innerHTML = `
                <div class="catalog-item">
                    <div class="setlist-info" onclick="selectSongDirectly('${song.id}')">
                        <div class="setlist-title">${song.title}</div>
                        <div class="setlist-sub">${song.category} • Tono: ${song.key}</div>
                    </div>
                    <div style="display: flex; gap: 6px; align-items: center;">
                        ${song.notes ? `<button class="btn sm" onclick="toggleNotesDisplay('cat-${song.id}')" title="Ver estructura de acordes">🎵 Notas</button>` : ''}
                        ${inSetlist 
                            ? '<span style="color:var(--accent-green); font-weight:700; font-size:12px; margin-right:4px;">✔ En lista</span>' 
                            : `<button class="btn sm" onclick="addToSetlist('${song.id}')">+ Añadir</button>`}
                        
                        <button class="btn btn-danger sm" onclick="deleteSongFromCatalog('${song.id}', '${song.title.replace(/'/g, "\\'")}')" title="Eliminar del repertorio">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                ${song.notes ? `<div id="notes-cat-${song.id}" class="notes-preview" style="display:none; padding:8px; background:var(--card-bg, #1e1e1e); border-left:3px solid var(--primary); font-family:monospace; margin-top:4px;">${song.notes}</div>` : ''}
            `;
            container.appendChild(div);
        });
    }

    async function saveSong() {
        const title = document.getElementById('newTitle').value.trim();
        const category = document.getElementById('newCategory').value;
        let key = document.getElementById('newKey').value;
        const body = document.getElementById('newBody').value.trim();
        const notes = document.getElementById('newNotes') ? document.getElementById('newNotes').value.trim() : '';

        if (!title || !body) {
            alert('Por favor completa el título y la letra con acordes.');
            return;
        }

        const btn = document.getElementById('btnSave');
        btn.disabled = true;
        btn.textContent = 'Guardando en la nube...';

        const payload = {
            id: Date.now().toString(),
            title: title,
            category: category,
            key: key,
            body: body,
            notes: notes
        };

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            await fetchSongs();
            document.getElementById('newTitle').value = '';
            document.getElementById('newBody').value = '';
            if (document.getElementById('newNotes')) document.getElementById('newNotes').value = '';
            showSection('hoy');
        } catch (e) {
            console.error(e);
            alert('Error al guardar la canción.');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Guardar Canción';
        }
    }

    async function deleteSongFromCatalog(songId, songTitle) {
        if (!confirm(`¿Estás seguro de que deseas eliminar "${songTitle}" del repertorio general?`)) {
            return;
        }

        const cleanId = songId.toString();

        songs = songs.filter(s => s.id.toString() !== cleanId);
        setlist = setlist.filter(item => item.songId.toString() !== cleanId);
        
        renderCatalog();
        renderSetlist();

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: "deleteSong",
                    id: cleanId
                })
            });
        } catch (e) {
            console.error("Error al conectar con la base de datos:", e);
            alert("No se pudo conectar con la base de datos en la nube.");
        }
    }

    async function syncSetlist() {
        setlist.forEach((item, i) => item.orden = i + 1);
        renderSetlist();
        renderCatalog();
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: "updateSetlist",
                    setlist: setlist
                })
            });
        } catch(e) {
            console.error("Error al guardar lista", e);
        }
    }

    function addToSetlist(songId) {
        setlist.push({ orden: setlist.length + 1, songId: songId });
        syncSetlist();
    }

    function removeFromSetlist(index) {
        setlist.splice(index, 1);
        syncSetlist();
    }

    function selectSongDirectly(id) {
        const song = songs.find(s => s.id.toString() === id.toString());
        if (!song) return;

        currentSong = song;
        semitoneOffset = 0;

        document.getElementById("songTitle").textContent = song.title;
        const catBadge = document.getElementById("songCategory");
        catBadge.textContent = song.category;
        
        updateDisplay();
        document.getElementById("songDisplay").style.display = "block";
        window.scrollTo({ top: document.getElementById("songDisplay").offsetTop - 10, behavior: 'smooth' });
    }

    function handleSongClick(e, songId) {
        selectSongDirectly(songId);
    }

    function showSection(sec) {
        document.getElementById('secHoy').style.display = sec === 'hoy' ? 'block' : 'none';
        document.getElementById('secAgregar').style.display = sec === 'agregar' ? 'block' : 'none';
        document.getElementById('secRepertorio').style.display = sec === 'repertorio' ? 'block' : 'none';
        
        document.getElementById('tabHoy').className = sec === 'hoy' ? 'active' : '';
        document.getElementById('tabRepertorio').className = sec === 'repertorio' ? 'active' : '';
        document.getElementById('tabAgregar').className = sec === 'agregar' ? 'active' : '';

        if (sec !== 'hoy') document.getElementById('songDisplay').style.display = 'none';
    }

    function transpose(semitones) {
        if (!currentSong) return;
        semitoneOffset += semitones;
        updateDisplay();
    }

    function transposeChord(chord, steps) {
        let root = chord.match(/^[A-G][#b]?/)?.[0];
        if (!root) return chord;

        let suffix = chord.slice(root.length);
        if (flatsToSharps[root]) root = flatsToSharps[root];

        let idx = chromaticScale.indexOf(root);
        if (idx === -1) return chord;

        let newIdx = (idx + steps) % 12;
        if (newIdx < 0) newIdx += 12;

        return chromaticScale[newIdx] + suffix;
    }

    function formatAndTransposeText(text, steps) {
        const chordRegex = /\b([A-G][#b]?(?:m|maj|min|dim|aug|sus|[0-9])*)(?:\/([A-G][#b]?))?\b/g;

        return text.replace(chordRegex, (match, baseChord, bassNote) => {
            let newChord = transposeChord(baseChord, steps);
            if (bassNote) {
                let newBass = transposeChord(bassNote, steps);
                newChord = newChord + '/' + newBass;
            }
            return `<span class="chord">${newChord}</span>`;
        });
    }

    function updateDisplay() {
        if (!currentSong) return;

        let baseKey = currentSong.key || "C";
        let isMinor = baseKey.endsWith('m');
        let rootNote = isMinor ? baseKey.slice(0, -1) : baseKey;
        
        if (flatsToSharps[rootNote]) rootNote = flatsToSharps[rootNote];
        
        const currentKeyTransposed = transposeChord(rootNote, semitoneOffset) + (isMinor ? 'm' : '');
        document.getElementById("keyDisplay").textContent = currentKeyTransposed;
        
        let bodyHTML = formatAndTransposeText(currentSong.body, semitoneOffset);
        if (currentSong.notes) {
            bodyHTML = `<div style="padding: 10px; background: rgba(255,255,255,0.05); border-radius: 6px; margin-bottom: 15px;"><strong>Estructura / Notas:</strong><br>${currentSong.notes}</div>` + bodyHTML;
        }
        
        document.getElementById("songBody").innerHTML = bodyHTML;
    }

    fetchSongs();
</script>
</body>
</html>
